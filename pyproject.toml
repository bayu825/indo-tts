[project]
name = "indo-tts"
version = "1.0.0"
description = "TTS Bahasa Indonesia pakai edge-tts"
requires-python = ">=3.10"
dependencies = [
    "edge-tts>=7.0.0",
    "fastapi>=0.100",
    "uvicorn>=0.13.0",
    "python-multipart>=0.0.21",
]

[tool.uv]
python-preference = "only-managed"

[project.scripts]
indo-tts = "server:main"
